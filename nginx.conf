server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html/web;

    # Web SPA assets and app on the main domain (chmaba.com root)
    location /assets/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Admin moved to its own origin (admin.chmaba.com); keep old /admin/* links working.
    location ~* ^/admin(?:/(.*))?$ {
        return 301 https://admin.chmaba.com/$1$is_args$args;
    }

    # API reverse proxy -> chmabapos_api (uvicorn), path preserved (/api/v1/...)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Interactive API docs (optional convenience)
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
}
