server {
    listen 80;
    server_name _;

    # Container healthcheck target.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    root /usr/share/nginx/html/web;

    # Web SPA assets and app on the main domain (chmaba.com root)
    location /assets/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Admin moved to its own origin (admin.chmaba.com); keep old /admin/* links working.
    location ~* ^/admin(?:/(.*))?$ {
        return 301 https://admin.chmaba.com/$1$is_args$args;
    }

    # API reverse proxy -> chmabapos_api (uvicorn), path preserved (/api/v1/...)
    # Re-resolve the api container via Docker DNS so a redeploy/restart with a
    # new container IP does not leave nginx pointed at a stale address.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Uploaded product images (served statically by the API).
    location /media/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Interactive API docs (optional convenience)
    location ~ ^/(docs|redoc|openapi.json) {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
    }
}
