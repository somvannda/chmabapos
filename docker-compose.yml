services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chmaba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chmaba}
      POSTGRES_DB: ${POSTGRES_DB:-chmabapos}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chmaba} -d ${POSTGRES_DB:-chmabapos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: chmabapos_api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chmaba}:${POSTGRES_PASSWORD:-chmaba}@db:5432/${POSTGRES_DB:-chmabapos}
      SYNC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-chmaba}:${POSTGRES_PASSWORD:-chmaba}@db:5432/${POSTGRES_DB:-chmabapos}
      # Secrets come from the host .env (see deploy notes); never committed.
      CHAMABAPAY_MODE: ${CHAMABAPAY_MODE:-mock}
      CHAMABAPAY_API_URL: ${CHAMABAPAY_API_URL:-https://pay.chmaba.com}
      CHAMABAPAY_API_KEY: ${CHAMABAPAY_API_KEY:-}
      CHAMABAPAY_WEBHOOK_SECRET: ${CHAMABAPAY_WEBHOOK_SECRET:-}
      CHAMABAPAY_PLATFORM_STORE_ID: ${CHAMABAPAY_PLATFORM_STORE_ID:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-no-reply@chmaba.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Chmaba POS}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_DIGEST_TIMEZONE: ${TELEGRAM_DIGEST_TIMEZONE:-Asia/Phnom_Penh}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    # nginx waits for this, so it does not proxy to an API that is still
    # waiting for the database. Mirrors deploy/docker-compose.prod.yml.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys,urllib.request as u; sys.exit(0 if u.urlopen('http://localhost:8000/api/v1/health', timeout=5).status == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  front:
    build:
      context: .
      dockerfile: Dockerfile.front
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy

  # Development email catcher (SMTP 1025, UI http://localhost:8025).
  # Keep only when SMTP_HOST=mailhog is set; remove in production.
  mailhog:
    image: mailhog/mailhog:latest
    profiles: ["dev"]
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  pgdata:
