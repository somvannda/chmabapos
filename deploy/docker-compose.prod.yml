# Production stack for Chmaba (Docker Compose v2).
# Run from the repo root after filling deploy/.env (copy from deploy/.env.example):
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# Topology served behind Cloudflare (SSL mode Full strict):
#   https://chmaba.com      -> apps/web   (marketing + portal + POS) + /api/v1
#   https://admin.chmaba.com -> apps/admin (platform control panel)   + /api/v1
#
# deploy/nginx.conf replaces the baked-in default and terminates TLS with the
# certificate in deploy/certs/ (Cloudflare Origin CA). Build contexts are '..'
# (the repo root).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chmaba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chmaba}
      POSTGRES_DB: ${POSTGRES_DB:-chmabapos}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chmaba} -d ${POSTGRES_DB:-chmabapos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: chmabapos_api/Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chmaba}:${POSTGRES_PASSWORD:-chmaba}@db:5432/${POSTGRES_DB:-chmabapos}
      SYNC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-chmaba}:${POSTGRES_PASSWORD:-chmaba}@db:5432/${POSTGRES_DB:-chmabapos}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-60}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://chmaba.com/api/v1/auth/google/callback}
      FRONTEND_URL: ${FRONTEND_URL:-https://chmaba.com}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://chmaba.com,https://admin.chmaba.com,https://www.chmaba.com}
      CUTLUY_MODE: ${CUTLUY_MODE:-mock}
      CUTLUY_API_URL: ${CUTLUY_API_URL:-https://cutluy.com/v1}
      CUTLUY_API_KEY: ${CUTLUY_API_KEY:-}
      CUTLUY_WEBHOOK_SECRET: ${CUTLUY_WEBHOOK_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST in deploy/.env}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-no-reply@chmaba.com}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  front:
    build:
      context: ..
      dockerfile: Dockerfile.front
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api

volumes:
  pgdata:
