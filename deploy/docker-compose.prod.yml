# Production stack for Chmaba (Docker Compose v2).
# Run from the repo root after filling deploy/.env (copy from deploy/.env.example):
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# Topology served behind Cloudflare (SSL mode Full strict):
#   https://chmaba.com       -> apps/web       (marketing + portal + POS) + /api/v1
#   https://admin.chmaba.com -> apps/admin     (platform control panel)   + /api/v1
#   https://shops.chmaba.com -> apps/storefront (public storefronts, SSR)  + /api/v1
#
# The storefront is its own origin so a merchant's public page can never collide
# with the portal's /{username}/{view} routes.
#
# deploy/nginx.conf replaces the baked-in default and terminates TLS with the
# certificate in deploy/certs/ (Cloudflare Origin CA). Build contexts are '..'
# (the repo root).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chmaba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chmaba}
      POSTGRES_DB: ${POSTGRES_DB:-chmabapos}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chmaba} -d ${POSTGRES_DB:-chmabapos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: chmabapos_api/Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chmaba}:${POSTGRES_PASSWORD:-chmaba}@db:5432/${POSTGRES_DB:-chmabapos}
      SYNC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-chmaba}:${POSTGRES_PASSWORD:-chmaba}@db:5432/${POSTGRES_DB:-chmabapos}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://chmaba.com/api/v1/auth/google/callback}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-https://chmaba.com}
      # Public base for store pages, so customer email can link to the branded
      # order-tracking page. Defaults to the live host like FRONTEND_URL above;
      # override in deploy/.env if the storefront ever moves.
      STOREFRONT_URL: ${STOREFRONT_URL:-https://shops.chmaba.com}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://chmaba.com,https://admin.chmaba.com,https://www.chmaba.com,https://shops.chmaba.com}
      CHAMABAPAY_MODE: ${CHAMABAPAY_MODE:-mock}
      CHAMABAPAY_API_URL: ${CHAMABAPAY_API_URL:-https://pay.chmaba.com}
      CHAMABAPAY_API_KEY: ${CHAMABAPAY_API_KEY:-}
      CHAMABAPAY_WEBHOOK_SECRET: ${CHAMABAPAY_WEBHOOK_SECRET:-}
      CHAMABAPAY_PLATFORM_STORE_ID: ${CHAMABAPAY_PLATFORM_STORE_ID:-}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST in deploy/.env}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-no-reply@chmaba.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Chmaba POS}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_DIGEST_TIMEZONE: ${TELEGRAM_DIGEST_TIMEZONE:-Asia/Phnom_Penh}
      MEDIA_ROOT: /data/media
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/data/media
    expose:
      - "8000"
    # The API waits for db, and front (nginx) waits for the API to be healthy,
    # so nginx does not serve 502/521 while migrations/seed run on startup.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys,urllib.request as u; sys.exit(0 if u.urlopen('http://localhost:8000/api/v1/health', timeout=5).status == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  storefront:
    # Server-rendered, so unlike web/admin this is a Node runtime rather than a
    # static bundle. It is not exposed to the host: only nginx reaches it, over
    # the compose network, on the storefront host.
    build:
      context: ..
      dockerfile: apps/storefront/Dockerfile
      args:
        # Public values the browser needs, inlined at build time. Blank leaves the
        # matching sign-in button hidden rather than shipping one that cannot work.
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_TELEGRAM_BOT_USERNAME: ${VITE_TELEGRAM_BOT_USERNAME:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      # The server render calls the API container directly. The browser instead
      # uses the storefront host's own /api path, which nginx proxies below, so
      # requests stay same-origin and need no CORS or SameSite=None cookies.
      INTERNAL_API_URL: http://api:8000/api/v1
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  front:
    build:
      context: ..
      dockerfile: Dockerfile.front
      args:
        # Public Cloudflare Turnstile site key, baked into the web bundle at
        # build time. Blank disables the widget.
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
        # Public storefront origin, switching every store link in the web app to
        # the branded address and revealing the header and footer Stores links.
        # Defaults to the live host like FRONTEND_URL; override in deploy/.env if
        # it moves. Inlined at BUILD time, so a change needs `up -d --build`.
        VITE_STOREFRONT_URL: ${VITE_STOREFRONT_URL:-https://shops.chmaba.com}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
      # nginx proxies the storefront host, so wait for it before going live.
      storefront:
        condition: service_healthy
    # Gate deploy `--wait` on nginx actually serving, so a bad front config or
    # a failed start is caught instead of silently leaving the origin down.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
  media:
