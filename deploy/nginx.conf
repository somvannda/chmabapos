# Production TLS termination for Chmaba on one origin: chmaba.com (web + API)
# and admin.chmaba.com (admin + API). Replaces the container default nginx.conf.
# Cloudflare proxies to this origin with SSL mode Full (strict), so a valid
# Origin CA (or other trusted) certificate must be mounted at
# /etc/nginx/certs/fullchain.pem + privkey.pem (see docker-compose.prod.yml).

# Plain HTTP -> HTTPS for every host hitting the origin directly.
server {
    listen 80 default_server;
    server_name _;

    # Container healthcheck target: answer on plain HTTP so the front
    # healthcheck does not depend on TLS certificates being valid. This must
    # be a location (not a server-level `return`) because a server-level
    # return runs before location selection and would shadow it.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- chmaba.com : website + user portal + POS + API ----------
server {
    listen 443 ssl;
    http2 on;
    server_name chmaba.com www.chmaba.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    root /usr/share/nginx/html/web;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Keep old chmaba.com/admin/* bookmarks working -> admin.chmaba.com root.
    location ~* ^/admin(?:/(.*))?$ {
        return 301 https://admin.chmaba.com/$1$is_args$args;
    }

    # Resolve the API container through Docker's embedded DNS and re-resolve
    # every 10s. Open-source nginx otherwise caches the upstream IP from config
    # load, which returns 502/521 on /api/* after the api container is
    # recreated (deploy or crash-restart) with a new address.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Uploaded product images (served statically by the API).
    location /media/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location ~ ^/(docs|redoc|openapi.json) {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------- admin.chmaba.com : platform admin control panel + API ----------
server {
    listen 443 ssl;
    http2 on;
    server_name admin.chmaba.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    root /usr/share/nginx/html/admin;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Resolve the API container through Docker's embedded DNS and re-resolve
    # every 10s. Open-source nginx otherwise caches the upstream IP from config
    # load, which returns 502/521 on /api/* after the api container is
    # recreated (deploy or crash-restart) with a new address.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
