name: Deploy

# Runs after the CI workflow completes on the default branch, so a red CI never
# deploys. Can also be triggered manually from the Actions tab.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Deploy only for a successful CI run triggered by a push to main. Without
    # the event/branch guard, every PR's CI success also triggered a deploy of
    # the current main (redundant, and noisy in the run list).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$SSH_USER@$SSH_HOST" DEPLOY_PATH="$DEPLOY_PATH" bash -s <<'REMOTE'
            set -euo pipefail
            cd "$DEPLOY_PATH"
            git fetch origin --prune
            git reset --hard origin/main
            # Build and create one service at a time. The origin also runs the
            # platform's other stacks, and building api+storefront+front in
            # parallel has OOM-killed this very command (exit 137), leaving the
            # stack half-replaced with nginx stopped. Serialising trades a few
            # minutes for a deploy that can actually finish.
            COMPOSE_PARALLEL_LIMIT=1 docker compose -f deploy/docker-compose.prod.yml up -d --build

            # nginx keeps its loaded config when the front container is reused,
            # so edits to the mounted deploy/nginx.conf are not applied by `up`
            # alone. Validate and reload gracefully (no downtime) before the
            # health-gated wait.
            sleep 5
            docker compose -f deploy/docker-compose.prod.yml exec -T front nginx -t
            docker compose -f deploy/docker-compose.prod.yml exec -T front nginx -s reload
            docker compose -f deploy/docker-compose.prod.yml up -d --wait --wait-timeout 300

            # Schema drift guard: a database whose recorded alembic revision is
            # ahead of its real schema makes `alembic upgrade head` a no-op and
            # breaks queries at runtime. Fail the deploy if any model table or
            # column is missing instead of serving 500s.
            echo "Checking schema drift..."
            docker compose -f deploy/docker-compose.prod.yml exec -T api \
              python chmabapos_api/scripts/check_schema_drift.py

            docker image prune -f

            # Post-deploy health check: poll the API's /api/v1/health (which also
            # pings the DB) inside the container. Fails the deploy if it never
            # becomes healthy, so a broken release is visible in the workflow.
            echo "Waiting for API health..."
            for attempt in $(seq 1 30); do
              if docker compose -f deploy/docker-compose.prod.yml exec -T api \
                python -c "import sys, urllib.request as u; sys.exit(0 if u.urlopen('http://localhost:8000/api/v1/health', timeout=5).status == 200 else 1)" \
                >/dev/null 2>&1; then
                echo "API healthy after $attempt attempt(s)"
                exit 0
              fi
              echo "health attempt $attempt/30 not ready yet"
              sleep 5
            done
            echo "API health check failed after 30 attempts"
            exit 1
          REMOTE

      # The SSH step proves the containers came up and the API answers the health
      # check on the server. It does not prove a visitor can reach anything. These
      # requests go out over the public internet and fetch what a real visitor
      # gets, which is the difference between "the deploy ran" and "the site works".
      #
      # Limitation worth knowing: this catches origin and proxy failures - the
      # class of mistake where a bad nginx config or a missing host breaks the
      # whole origin. It does NOT catch a broken client-side bundle, because a
      # crashed SPA still returns 200 with its shell. Catching that needs a real
      # browser, which is a larger step than this.
      - name: Smoke-test the public surfaces
        run: |
          set -euo pipefail
          # Fail only on what this check exists to catch: an origin or proxy that
          # is genuinely broken. Both hosts sit behind Cloudflare, which may
          # challenge or block a request from a datacenter IP, so an edge 403/503
          # is reported as a warning rather than failing an otherwise good deploy.
          for url in https://chmaba.com/ https://admin.chmaba.com/; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url") || code="000"
            case "$code" in
              2*|3*) echo "$url -> $code" ;;
              000|5*) echo "::error::$url returned $code after deploy"; exit 1 ;;
              *) echo "::warning::$url returned $code - not counted as a deploy failure" ;;
            esac
          done
          # Add https://shops.chmaba.com/ here once its DNS record and a
          # certificate covering the host exist.
