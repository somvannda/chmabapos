name: API error log

# Read-only, manual diagnostic: pull the API container's recent tracebacks from
# the production host so a 500 that only happens there can be diagnosed without
# shelling in. Reuses the same SSH secrets as the deploy workflow, so no new
# credentials leave GitHub. Nothing is written to the server.
on:
  workflow_dispatch:
    inputs:
      lines:
        description: "How many recent log lines to scan"
        required: false
        default: "800"

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch recent API tracebacks
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          LINES: ${{ inputs.lines }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$SSH_USER@$SSH_HOST" DEPLOY_PATH="$DEPLOY_PATH" LINES="$LINES" bash -s <<'REMOTE'
            set -euo pipefail
            cd "$DEPLOY_PATH"
            echo "--- api container: last ${LINES} lines, filtered ---"
            docker compose -f deploy/docker-compose.prod.yml logs --tail "$LINES" --no-color api \
              | grep -E -n "Traceback|purchases|IntegrityError|Unhandled|Error" -A 30 \
              | tail -n 500 || true
          REMOTE
