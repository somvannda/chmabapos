name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    name: API (chmabapos_api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chmabapos_api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Regenerate OpenAPI spec
        run: python chmabapos_api/scripts/export_openapi.py
        working-directory: .
      - name: Check spec is up to date
        run: git diff --exit-code -- chmabapos_api/openapi.json
        working-directory: .

  web:
    name: Web (apps/web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  admin:
    name: Admin (apps/admin)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
