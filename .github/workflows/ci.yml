name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    name: API (chmabapos_api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chmabapos_api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chmaba_v1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailhog:
        image: mailhog/mailhog:latest
        ports:
          - 1025:1025
          - 8025:8025
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/chmaba_v1
      SYNC_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/chmaba_v1
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "1025"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Create test database
        working-directory: .
        env:
          CHMABA_DATABASE: chmaba_v1
          CHMABA_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: python chmabapos_api/scripts/create_database.py
      - name: Run migrations
        working-directory: .
        run: alembic -c chmabapos_api/alembic.ini upgrade head
      - name: Seed reference data
        working-directory: .
        run: python chmabapos_api/scripts/seed.py
      - name: Check schema drift
        working-directory: .
        run: python chmabapos_api/scripts/check_schema_drift.py
      - name: Run tests
        run: pytest -q
      - name: Regenerate OpenAPI spec
        working-directory: .
        run: python chmabapos_api/scripts/export_openapi.py
      - name: Check spec is up to date
        working-directory: .
        run: git diff --exit-code -- chmabapos_api/openapi.json

  web:
    name: Web (apps/web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  storefront:
    name: Storefront (apps/storefront)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/storefront
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/storefront/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  admin:
    name: Admin (apps/admin)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chmaba_v1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailhog:
        image: mailhog/mailhog:latest
        ports:
          - 1025:1025
          - 8025:8025
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/chmaba_v1
      SYNC_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/chmaba_v1
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "1025"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        working-directory: chmabapos_api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Create test database
        working-directory: .
        env:
          CHMABA_DATABASE: chmaba_v1
          CHMABA_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: python chmabapos_api/scripts/create_database.py
      - name: Run migrations
        working-directory: .
        run: alembic -c chmabapos_api/alembic.ini upgrade head
      - name: Seed reference data
        working-directory: .
        run: python chmabapos_api/scripts/seed.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      # The end-to-end suite drives the storefront too, and Playwright starts its
      # dev server from apps/web/playwright.config.js.
      - name: Install storefront dependencies
        working-directory: apps/storefront
        run: npm ci
      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        working-directory: apps/web
        run: npm run e2e

  api-client:
    name: API client drift
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/api-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Regenerate types
        run: npm run generate
      - name: Check the generated types are committed
        working-directory: .
        run: git diff --exit-code -- packages/api-client/src/schema.d.ts

  ops-config:
    name: Ops config (nginx + compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A malformed compose file, or a required variable that is missing, fails
      # here instead of at deploy time - when it would take the whole origin down
      # rather than one host. Neither file is covered by any other job.
      - name: Validate the production compose file
        run: |
          printf 'JWT_SECRET=ci-placeholder-not-a-real-secret\nSMTP_HOST=localhost\n' > deploy/.env
          docker compose -f deploy/docker-compose.prod.yml config > /dev/null
      # nginx refuses to test a config whose certificate files are absent, so
      # generate a throwaway pair for the check only. The real certificates are
      # mounted at deploy/certs on the server and never live in the repository.
      - name: Validate the nginx configuration
        run: |
          mkdir -p deploy/certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout deploy/certs/privkey.pem -out deploy/certs/fullchain.pem \
            -subj "/CN=localhost" 2>/dev/null
          docker run --rm \
            -v "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/deploy/certs:/etc/nginx/certs:ro" \
            nginx:1.27-alpine nginx -t

  front-image:
    name: Front image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the front Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.front
          push: false
          tags: chmaba-front:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  android:
    name: Android (apps/android)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build and run unit tests
        # ubuntu-latest ships the Android SDK, so no extra setup step is needed.
        # `chmod +x` guards against the wrapper losing its executable bit on a
        # checkout that does not preserve modes.
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug testDebugUnitTest

  ios:
    name: iOS (apps/ios)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # apps/ios has no SVG runtime, so ChmabaIcons.swift carries its own path-data parser,
      # and SCREENS.md forbids changing the icon set. That makes the parser load-bearing and
      # it cannot be checked by building: the app only builds on iOS.
      #
      # verify-icons.sh compiles the parser's real source text on this Linux runner against
      # a Path that records geometry calls, then diffs its render of all 71 icons against a
      # reference render of the same path data. No Xcode and no Mac are involved, which is
      # why this can run at all.
      - name: Install rsvg-convert
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin
      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Verify the Lucide icon port
        # `bash <script>` rather than `./<script>`: the executable bit is recorded in git,
        # but a checkout that does not preserve modes would strip it and fail with a bare
        # "Permission denied". The Android job guards the same way with `chmod +x gradlew`.
        run: bash apps/ios/scripts/verify-icons.sh
