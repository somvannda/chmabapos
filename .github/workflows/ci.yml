name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    name: API (chmabapos_api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chmabapos_api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chmaba_v1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailhog:
        image: mailhog/mailhog:latest
        ports:
          - 1025:1025
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/chmaba_v1
      SYNC_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/chmaba_v1
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "1025"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Create test database
        working-directory: .
        env:
          CHMABA_DATABASE: chmaba_v1
          CHMABA_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: python chmabapos_api/scripts/create_database.py
      - name: Run migrations
        working-directory: .
        run: alembic -c chmabapos_api/alembic.ini upgrade head
      - name: Seed reference data
        working-directory: .
        run: python chmabapos_api/scripts/seed.py
      - name: Run tests
        run: pytest -q
      - name: Regenerate OpenAPI spec
        working-directory: .
        run: python chmabapos_api/scripts/export_openapi.py
      - name: Check spec is up to date
        working-directory: .
        run: git diff --exit-code -- chmabapos_api/openapi.json

  web:
    name: Web (apps/web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  admin:
    name: Admin (apps/admin)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
